[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polcal"
version = "0.1.0"
description = "In-flight polarimetric calibration using ocean sunglint"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",
    "xarray>=2024.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "netcdf4>=1.6",
    "h5py>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "ipykernel>=6.0",
    "jupyter>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/polcal"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
